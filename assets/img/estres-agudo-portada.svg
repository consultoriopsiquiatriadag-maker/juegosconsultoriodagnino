<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Un anillo agrietado con una grieta luminosa que empieza a cerrarse, bajo un cielo de tormenta que se despeja">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a2b"/><stop offset=".7" stop-color="#1e2f3c"/><stop offset="1" stop-color="#2d4a5a"/>
    </linearGradient>
    <radialGradient id="dawn" cx="0.5" cy="1" r="0.7">
      <stop offset="0" stop-color="#9fd6e8" stop-opacity=".55"/><stop offset="1" stop-color="#9fd6e8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dawn)"/>
  <!-- nubes -->
  <g fill="#0b1a2b" fill-opacity=".55">
    <ellipse cx="300" cy="170" rx="260" ry="70"/><ellipse cx="520" cy="130" rx="200" ry="60"/>
    <ellipse cx="1260" cy="190" rx="280" ry="72"/><ellipse cx="1080" cy="140" rx="190" ry="55"/>
  </g>
  <!-- anillo -->
  <circle cx="800" cy="470" r="230" fill="none" stroke="#bfe3ef" stroke-width="30" stroke-opacity=".85"/>
  <circle cx="800" cy="470" r="170" fill="#9fd6e8" fill-opacity=".08"/>
  <!-- grieta -->
  <polyline points="800,230 770,320 830,390 785,470 835,550 795,640 800,700" fill="none" stroke="#0b1a2b" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="800,230 770,320 830,390 785,470 835,550 795,640 800,700" fill="none" stroke="#ffe9b0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- olas calmas -->
  <g fill="none" stroke="#bfe3ef" stroke-opacity=".5" stroke-width="4" stroke-linecap="round">
    <path d="M100 760 q60 -26 120 0 t120 0 t120 0 t120 0"/>
    <path d="M1010 780 q60 -26 120 0 t120 0 t120 0 t120 0"/>
  </g>
</svg>
