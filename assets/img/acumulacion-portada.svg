<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Pila de cajas y objetos apilados con un espacio despejado al centro">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2239"/><stop offset="1" stop-color="#3a3120"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0.62" r="0.28">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity=".55"/><stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect y="720" width="1600" height="180" fill="#1a1a1a" fill-opacity=".35"/>
  <!-- pila izquierda -->
  <g>
    <rect x="80" y="560" width="300" height="200" rx="14" fill="#8a6a3b"/>
    <rect x="130" y="400" width="260" height="170" rx="14" fill="#a8844d"/>
    <rect x="60" y="300" width="230" height="110" rx="14" fill="#6f5530"/>
    <rect x="200" y="210" width="190" height="100" rx="14" fill="#c19a5b"/>
    <rect x="380" y="620" width="170" height="140" rx="14" fill="#7a5d34"/>
    <rect x="420" y="500" width="150" height="130" rx="14" fill="#9b7a45"/>
  </g>
  <!-- pila derecha -->
  <g>
    <rect x="1230" y="540" width="300" height="220" rx="14" fill="#7a5d34"/>
    <rect x="1190" y="380" width="250" height="170" rx="14" fill="#a8844d"/>
    <rect x="1300" y="260" width="230" height="130" rx="14" fill="#8a6a3b"/>
    <rect x="1050" y="610" width="190" height="150" rx="14" fill="#9b7a45"/>
    <rect x="1010" y="480" width="170" height="140" rx="14" fill="#6f5530"/>
    <rect x="1130" y="170" width="150" height="100" rx="14" fill="#c19a5b"/>
  </g>
  <!-- espacio despejado -->
  <ellipse cx="800" cy="640" rx="260" ry="46" fill="#ffe9b0" fill-opacity=".25"/>
  <circle cx="800" cy="520" r="260" fill="url(#light)"/>
  <rect x="740" y="600" width="120" height="120" rx="12" fill="#d9c08a" fill-opacity=".85"/>
  <g stroke="#e8d8b0" stroke-opacity=".35" stroke-width="3">
    <line x1="100" y1="610" x2="360" y2="610"/><line x1="1250" y1="590" x2="1510" y2="590"/>
  </g>
</svg>
