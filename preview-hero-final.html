<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview Final — Dr. Dagnino</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #0f172a; }

  .tabs {
    display: flex; background: #0f172a;
    border-bottom: 1px solid rgba(255,255,255,.08);
    padding: 0 20px;
  }
  .tab {
    padding: 12px 22px; border: none; background: none; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 500;
    color: rgba(255,255,255,.4); border-bottom: 2px solid transparent; transition: all .15s;
  }
  .tab.active { color: #60a5fa; border-bottom-color: #60a5fa; }
  .view { display: none; }
  .view.active { display: block; }

  /* HEADER */
  .site-header {
    background: #0e2239; padding: 11px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand-badge {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(255,255,255,.14);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .brand-title { color: white; font-size: 13px; font-weight: 600; line-height: 1.3; }
  .brand-sub { color: rgba(255,255,255,.45); font-size: 11px; }
  .font-btns { display: flex; gap: 5px; }
  .font-btns button {
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
    color: white; padding: 5px 10px; border-radius: 5px; font-size: 11px; font-family: inherit;
  }

  /* HERO */
  .hero-section {
    position: relative; overflow: hidden;
    background: #081a2f; min-height: 580px;
  }
  .hero-image {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 32% 42%; display: block;
  }

  /* Viñeta lateral */
  .hero-section::before {
    content: ""; position: absolute; inset: 0; z-index: 1;
    background:
      linear-gradient(to right,
        rgba(8,26,47,.92) 0%,
        rgba(8,26,47,.3)  10%,
        rgba(8,26,47,0)   26%,
        rgba(8,26,47,0)   48%,
        rgba(8,26,47,.5)  66%,
        rgba(8,26,47,.92) 82%,
        rgba(8,26,47,1)   100%
      );
    pointer-events: none;
  }

  /* Viñeta superior + inferior */
  .hero-section::after {
    content: ""; position: absolute; inset: 0; z-index: 1;
    background:
      linear-gradient(to bottom,
        rgba(8,26,47,.75) 0%,
        rgba(8,26,47,.1)  10%,
        rgba(8,26,47,0)   25%,
        rgba(8,26,47,0)   58%,
        rgba(8,26,47,.5)  78%,
        rgba(8,26,47,.88) 90%,
        rgba(8,26,47,1)   100%
      );
    pointer-events: none;
  }

  /* Card flotante */
  .hero-card {
    position: absolute; right: 6%; top: 50%; transform: translateY(-50%);
    z-index: 2; width: 380px; max-width: 44%;
    background: rgba(15,30,55,.65);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 20px; padding: 30px 26px;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    background: rgba(255,255,255,.12); border-radius: 999px;
    padding: 5px 13px; margin-bottom: 13px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #22c55e;
    animation: pulse 1.35s ease-in-out infinite;
  }
  @keyframes pulse {
    0%   { transform:scale(1);   box-shadow:0 0 0 0 rgba(34,197,94,.55); }
    55%  { transform:scale(1.07);box-shadow:0 0 0 9px rgba(34,197,94,0); }
    100% { transform:scale(1);   box-shadow:0 0 0 0 rgba(34,197,94,0); }
  }
  .pill span { font-size: 12px; color: rgba(255,255,255,.9); }
  .hero-title {
    font-size: 36px; font-weight: 700; color: white !important;
    line-height: 1.15; text-shadow: 0 2px 16px rgba(0,0,0,.45);
  }

  /* Wave */
  .hero-wave { margin-top:-2px; line-height:0; background:#081a2f; }
  .hero-wave svg { width:100%; height:52px; display:block; }

  /* MÓVIL */
  .mobile-wrap { display:flex; justify-content:center; padding:28px 16px 20px; }
  .mobile-frame {
    width: 375px; background: white; border-radius: 32px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5); border: 6px solid #374151;
  }
  .mobile-frame .hero-section { min-height: 720px; }
  .mobile-frame .hero-image { object-position: 42% 28%; }
  .mobile-frame .hero-section::before {
    background: linear-gradient(to right,
      rgba(8,26,47,.7) 0%, rgba(8,26,47,0) 18%,
      rgba(8,26,47,0) 60%, rgba(8,26,47,.7) 100%);
  }
  .mobile-frame .hero-card {
    position:absolute; left:14px; right:14px; top:auto; bottom:24px;
    transform:none; width:auto; max-width:none; border-radius:14px; padding:20px 18px;
  }
  .mobile-frame .hero-title { font-size:28px; }
  .mobile-frame .site-header { padding: 10px 14px; }
  .mobile-frame .hero-wave svg { height:36px; }
</style>
</head>
